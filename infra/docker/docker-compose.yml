# Local development infrastructure for ARF-OS.
#
# Spec 19.2 requires integration tests to run against real PostgreSQL and
# Redis rather than mocks, and spec 20.1 targets Railway, where the same three
# backing services exist. MinIO stands in for Cloudflare R2 / S3 locally so
# the object-store code path is exercised the same way in every environment.
#
#   docker compose -f infra/docker/docker-compose.yml up -d
#
# Data lives in named volumes; `docker compose down -v` resets everything.

name: arf-os

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arf
      POSTGRES_PASSWORD: arf_local_dev
      POSTGRES_DB: arf
      # Deterministic collation: index ordering must not vary by host locale.
      LANG: C
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arf -d arf']
      interval: 5s
      timeout: 3s
      retries: 20

  # A separate database for integration tests, so a test run can truncate
  # freely without destroying local development data.
  postgres-test:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arf
      POSTGRES_PASSWORD: arf_local_dev
      POSTGRES_DB: arf_test
      LANG: C
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '5433:5432'
    # Tests recreate schema on demand, so this database is intentionally
    # ephemeral: no volume, and it resets whenever the container is replaced.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arf -d arf_test']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ requires keyspace notifications for delayed and stalled jobs.
    command: redis-server --appendonly yes --notify-keyspace-events Ex
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for raw TradingView uploads, Pine source
  # bundles, and compressed equity series (spec 14.6, 14.7).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arf_local
      MINIO_ROOT_PASSWORD: arf_local_dev_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the buckets once MinIO is healthy, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 arf_local arf_local_dev_secret &&
      mc mb --ignore-existing local/arf-artefacts &&
      mc mb --ignore-existing local/arf-uploads &&
      mc version enable local/arf-artefacts &&
      echo 'buckets ready'
      "
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
